<!doctype html>
<html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Мастерская маскота — 100 идей</title><style>
:root{
  --bg:#11121a;--card:#1a1c26;--line:#2b2e3d;--fg:#e8eaf3;--mut:#9aa0b5;--acc:#7c5cff;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--fg);
  font:15px/1.45 -apple-system,"Segoe UI",Roboto,system-ui,sans-serif;
  padding:calc(10px + env(safe-area-inset-top)) 12px calc(90px + env(safe-area-inset-bottom))}
h1{font-size:18px;margin:0 0 2px}
.sub{color:var(--mut);font-size:12.5px;margin:0 0 12px}
.bar{position:sticky;top:0;z-index:5;background:linear-gradient(var(--bg),var(--bg) 88%,transparent);padding-bottom:8px}
.search{width:100%;padding:11px 13px;border-radius:12px;border:1px solid var(--line);
  background:var(--card);color:var(--fg);font-size:14px;outline:none}
.search:focus{border-color:var(--acc)}
.chips{display:flex;gap:6px;overflow-x:auto;margin:8px 0;padding-bottom:2px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:0 0 auto;padding:7px 12px;border-radius:999px;border:1px solid var(--line);
  background:var(--card);color:var(--mut);font-size:12.5px;cursor:pointer;white-space:nowrap}
.chip.on{border-color:var(--acc);color:#fff;background:color-mix(in srgb,var(--acc) 22%,var(--card))}
.grp{display:flex;align-items:center;gap:8px;margin:16px 0 6px;font-size:12px;
  text-transform:uppercase;letter-spacing:.08em;color:var(--mut)}
.grp i{width:6px;height:6px;border-radius:50%;display:block}
.row{display:flex;gap:10px;align-items:flex-start;padding:11px 12px;margin-bottom:6px;
  border:1px solid var(--line);border-radius:13px;background:var(--card);cursor:pointer;
  transition:border-color .15s,background .15s}
.row.on{border-color:var(--acc);background:color-mix(in srgb,var(--acc) 12%,var(--card))}
.num{flex:0 0 30px;color:var(--mut);font-variant-numeric:tabular-nums;font-size:11.5px;
  padding-top:2px;font-weight:600}
.body{flex:1;min-width:0}
.ttl{font-weight:600;font-size:14px;line-height:1.3;display:block}
.desc{color:var(--mut);font-size:12.5px;line-height:1.35;display:block;margin-top:2px}
.meta{margin-top:5px;display:flex;gap:5px;flex-wrap:wrap}
.tag{font-size:10.5px;padding:2px 7px;border-radius:999px;border:1px solid var(--line);color:var(--mut)}
.tag.smart{color:#c4b5fd;border-color:#4c3d8f;background:#241f47}
.box{flex:0 0 22px;height:22px;border-radius:7px;border:2px solid var(--line);
  display:grid;place-items:center;margin-top:1px;color:transparent;font-size:13px}
.row.on .box{border-color:var(--acc);background:var(--acc);color:#fff}
.foot{position:fixed;left:0;right:0;bottom:0;padding:10px 12px calc(10px + env(safe-area-inset-bottom));
  background:linear-gradient(transparent,var(--bg) 22%);display:flex;gap:8px;align-items:center}
.cnt{flex:0 0 auto;font-size:12.5px;color:var(--mut);padding:0 2px}
.btn{flex:1;padding:12px;border-radius:12px;border:1px solid var(--line);background:var(--card);
  color:var(--fg);font-size:13.5px;font-weight:600;cursor:pointer}
.btn.pri{background:var(--acc);border-color:var(--acc);color:#fff}
.btn:active{transform:scale(.98)}
.hint{color:var(--mut);font-size:11.5px;text-align:center;margin:24px 0 8px}
.empty{padding:28px;text-align:center;color:var(--mut)}
</style></head><body>
<h1>Мастерская маскота</h1>
<p class="sub">100 идей для компаньона. 20 из них делают его по-настоящему умнее. Отметьте нужные — внизу счётчик.</p>
<div class="bar">
  <input class="search" id="q" type="search" placeholder="Поиск по идеям…" autocomplete="off">
  <div class="chips" id="cats"></div>
  <div class="chips" id="costs"></div>
</div>
<div id="list"></div>
<div class="foot">
  <span class="cnt" id="cnt">0 / 100</span>
  <button class="btn" id="copy">Скопировать</button>
  <button class="btn pri" id="save">Сохранить выбор</button>
</div><script>window.IDEAS=[{"n":1,"i":"mind-topic-memory","c":"mind","m":1,"s":"M","t":"Помнит, о чём были прошлые чаты","te":"Remembers what earlier chats were about","d":"Одна строка темы на сессию — может сказать «в прошлый раз чинили авторизацию»","de":"One-line topic per session, so it can say \"last time you fixed auth\""},{"n":2,"i":"mind-next-step","c":"mind","m":1,"s":"M","t":"Предугадывает следующий шаг агента","te":"Predicts the agent's next step","d":"Смотрит на текущий инструмент и готовит реакцию заранее","de":"Reads the running tool and prepares the matching reaction before the result lands"},{"n":3,"i":"mind-queue","c":"mind","m":1,"s":"S","t":"Видит очередь сообщений","te":"Sees the message queue","d":"Считает очередь запросов и говорит «ещё 3 в очереди»","de":"Counts queued prompts and says \"3 more waiting\" instead of idling"},{"n":4,"i":"mind-adaptive-rate","c":"mind","m":1,"s":"S","t":"Подстраивает частоту реплик","te":"Adapts how often it talks","d":"Меньше слов, когда пользователь отвечает быстро; больше — когда тихо","de":"Fewer lines when the user replies fast, more when the chat is quiet"},{"n":5,"i":"mind-mood-fsm","c":"mind","m":1,"s":"M","t":"Настроение как конечный автомат","te":"Mood as a real state machine","d":"Спокойный → любопытный → скучающий → сонный с явными переходами","de":"Calm → curious → bored → sleepy with explicit transitions, no random jumping"},{"n":6,"i":"mind-quiet-typing","c":"mind","m":1,"s":"S","t":"Знает, когда молчать","te":"Knows when to shut up","d":"Перестаёт болтать, пока пользователь печатает","de":"Stops all chatter while the user is actively typing"},{"n":7,"i":"mind-error-digest","c":"mind","m":1,"s":"M","t":"Читает ошибку за тебя","te":"Reads the error for you","d":"Выдёргивает главную строку из stderr и называет её одной фразой","de":"Picks the key line out of stderr and names it in one sentence"},{"n":8,"i":"mind-stuck-detect","c":"mind","m":1,"s":"M","t":"Замечает тупик","te":"Detects being stuck","d":"Три неудачные попытки подряд → предлагает сменить подход","de":"Three failing attempts in a row → suggests a different approach"},{"n":9,"i":"mind-cost-watch","c":"mind","m":1,"s":"M","t":"Следит за стоимостью сессии","te":"Watches the session cost","d":"Предупреждает, когда долгий чат становится дорогим","de":"Warns before a long chat gets expensive"},{"n":10,"i":"mind-model-pattern","c":"mind","m":1,"s":"M","t":"Запоминает модель под задачу","te":"Learns which model you use for what","d":"Запоминает выбор и предлагает привычную модель для типа задачи","de":"Remembers your choices and suggests the usual model for the task type"},{"n":11,"i":"mind-hint-fatigue","c":"mind","m":1,"s":"S","t":"Не повторяет игнор","te":"Gives up on ignored hints","d":"Закрытый тип подсказки замолкает на десять минут","de":"A dismissed hint type is muted for ten minutes"},{"n":12,"i":"mind-summary","c":"mind","m":1,"s":"L","t":"Сжимает длинную сессию","te":"Summarises a long session","d":"Одно предложение в пузыре вместо стены текста","de":"One sentence in the bubble instead of a wall of text"},{"n":13,"i":"mind-eta","c":"mind","m":1,"s":"M","t":"Оценивает время ответа","te":"Estimates the answer time","d":"Учит задержку модели и показывает «~15с» при генерации","de":"Learns per-model latency and shows \"~15s\" while generating"},{"n":14,"i":"mind-repeat-question","c":"mind","m":1,"s":"M","t":"Ловит повторный вопрос","te":"Spots a repeated question","d":"Напоминает, где на такой вопрос уже отвечали","de":"Reminds you where the same question was already answered"},{"n":15,"i":"mind-intent","c":"mind","m":1,"s":"L","t":"Понимает намерение","te":"Understands the intent","d":"Код / вопрос / рефакторинг / объяснение → свой набор реплик","de":"Code / question / refactor / explain → a different set of lines"},{"n":16,"i":"mind-no-progress","c":"mind","m":1,"s":"M","t":"Замечает застой","te":"Notices a stalling session","d":"Нет удачных инструментов N минут → предлагает конкретную подсказку"  differently"},{"n":76,"i":"int-chase","c":"int","m":0,"s":"M","t":"Игра «догони»","te":"Play chase","d":"Тапни в точку — он бежит туда","de":"Tap a spot and it runs there"},{"n":77,"i":"int-brush","c":"int","m":0,"s":"S","t":"Расчесать шёрстку","te":"Brush its fur","d":"Проведи по нему — расчёсывание и успокоение","de":"Swipe over it to groom and calm it"},{"n":78,"i":"int-tricks","c":"int","m":0,"s":"L","t":"Учит трюки","te":"Learns tricks","d":"Новый трюк открывается после N поглаживаний","de":"A new trick unlocked after N pets"},{"n":79,"i":"int-companion","c":"int","m":0,"s":"L","t":"Второй компаньон","te":"A second companion","d":"Два питомца, которые общаются между собой","de":"Two pets that interact with each other"},{"n":80,"i":"int-voice-cmd","c":"int","m":0,"s":"L","t":"Голосовые команды","te":"Voice commands","d":"«Иди сюда», «спать» вслух","de":"\"Come here\", \"sleep\" said out loud"},{"n":81,"i":"int-widget","c":"int","m":0,"s":"L","t":"Виджет на рабочий стол","te":"Android home widget","d":"Питомец живёт и на лаунчере","de":"The pet lives on the launcher too"},{"n":82,"i":"int-miss-you","c":"int","m":0,"s":"S","t":"Скучает","te":"Misses you","d":"Уведомление после долгого отсутствия","de":"A notification after a long absence"},{"n":83,"i":"int-sleep-together","c":"int","m":0,"s":"S","t":"Спит вместе с приложением","te":"Sleeps with the app","d":"Сворачивается в ночном режиме","de":"Curled up in night mode"},{"n":84,"i":"int-birthday","c":"int","m":0,"s":"S","t":"День рождения установки","te":"Install birthday","d":"Маленький праздник раз в год","de":"A small party once a year"},{"n":85,"i":"int-cross-session","c":"int","m":0,"s":"M","t":"Дружба между сессиями","te":"Friendship across sessions","d":"Общая память о симпатии между чатами","de":"Shared memory of affection between chats"},{"n":86,"i":"work-tool-anim","c":"work","m":0,"s":"S","t":"Анимированные инструменты","te":"Animated tools in paws","d":"Курсор терминала мигает, ручка пишет","de":"The terminal cursor blinks, the pen moves"},{"n":87,"i":"work-progress","c":"work","m":0,"s":"S","t":"Мини-прогресс-бар","te":"Tiny progress bar","d":"Тонкая полоска над головой при генерации","de":"A slim bar above the head while generating"},{"n":88,"i":"work-diff-stat","c":"work","m":0,"s":"M","t":"Показывает статистику диффа","te":"Shows diff stats","d":"«+12 −3» после правки","de":"\"+12 −3\" after an edit"},{"n":89,"i":"work-file-hl","c":"work","m":0,"s":"M","t":"Указывает на правимый файл","te":"Points at the edited file","d":"Короткая стрелка к имени файла","de":"A short arrow to the file name"},{"n":90,"i":"work-terminal-post","c":"work","m":0,"s":"S","t":"Стоит у терминала","te":"Stands at the terminal","d":"Встаёт рядом с вкладкой терминала при bash","de":"Moves next to the terminal tab during bash"},{"n":91,"i":"work-fm-follow","c":"work","m":0,"s":"S","t":"Следит за файлами","te":"Follows the file manager","d":"Гуляет рядом при просмотре файлов","de":"Walks with you while browsing files"},{"n":92,"i":"work-git","c":"work","m":0,"s":"M","t":"Читает git-статус","te":"Reads git status","d":"Грязное дерево заставляет его нервничать","de":"A dirty tree makes it fidgety"},{"n":93,"i":"work-test-pass","c":"work","m":0,"s":"S","t":"Радуется зелёным тестам","te":"Celebrates a passing test","d":"Палец вверх, когда тесты прошли","de":"A thumbs-up when a test run passes"},{"n":94,"i":"work-coffee","c":"work","m":0,"s":"S","t":"Приносит кофе","te":"Brings coffee","d":"Кружка на задачах дольше 5 минут","de":"A mug prop on tasks longer than 5 minutes"},{"n":95,"i":"work-queue-badge","c":"work","m":0,"s":"S","t":"Значок очереди","te":"Queue badge","d":"Маленькая «2», когда ждут сообщения","de":"A small \"2\" when messages are waiting"},{"n":96,"i":"work-retry","c":"work","m":0,"s":"S","t":"Индикатор ретраев","te":"Retry indicator","d":"Показывает смену ключа или номер ретрая","de":"Shows the key rotation or retry count"},{"n":97,"i":"work-model-plate","c":"work","m":0,"s":"S","t":"Табличка модели","te":"Model nameplate","d":"Текущая модель на маленькой табличке","de":"The current model on a tiny sign"},{"n":98,"i":"work-cost-meter","c":"work","m":0,"s":"M","t":"Счётчик стоимости","te":"Cost meter","d":"Тонкая шкала, заполняющаяся за сессию","de":"A thin gauge that fills with the session"},{"n":99,"i":"work-hide-focus","c":"work","m":0,"s":"S","t":"Прячется в фокусе","te":"Hides in focus mode","d":"Уходит с дороги до конца фокуса","de":"Out of the way until focus mode ends"},{"n":100,"i":"work-continue-arrow","c":"work","m":0,"s":"S","t":"Стрелка к «Продолжить»","te":"Arrow to Continue","d":"Настоящая стрелка на кнопку","de":"A real arrow pointing at the button"}];window.CATS={"mind":["Умнее","#7c5cff"],"anim":["Анимация","#38bdf8"],"say":["Речь","#4ade80"],"look":["Внешний вид","#ffd166"],"int":["Взаимодействие","#ff9f43"],"work":["Работа","#f472b6"]};</script><script>
(function(){
const KEY='ocm.mascotIdeaBacklog.v1';
let picked=new Set();
try{picked=new Set(JSON.parse(localStorage.getItem(KEY)||'[]'))}catch(e){picked=new Set()}

let q='',cat='all',cost='all';
const el=id=>document.getElementById(id);
const CATORDER=['mind','anim','say','look','int','work'];
const COSTS={S:'дёшево',M:'средне',L:'крупно'};

function saveLocal(){
  try{localStorage.setItem(KEY,JSON.stringify([...picked]))}catch(e){}
  el('cnt').textContent=picked.size+' / 100';
}

function chip(label,on,fn){
  const b=document.createElement('button');
  b.className='chip'+(on?' on':'');
  b.textContent=label;
  b.onclick=fn;
  return b;
}

function drawChips(){
  const c=el('cats');c.textContent='';
  c.append(chip('Все (100)',cat==='all',()=>{cat='all';render()}));
  CATORDER.forEach(k=>{
    const n=IDEAS.filter(x=>x.c===k).length;
    c.append(chip(CATS[k][0]+' ('+n+')',cat===k,()=>{cat=k;render()}));
  });
  const co=el('costs');co.textContent='';
  co.append(chip('Любой размер',cost==='all',()=>{cost='all';render()}));
  Object.keys(COSTS).forEach(k=>co.append(chip(k+' · '+COSTS[k],cost===k,()=>{cost=k;render()})));
  co.append(chip('Только умные',false,()=>{
    cat=cat==='mind'?'all':'mind';render();
  }));
}

function render(){
  drawChips();saveLocal();
  const list=el('list');list.textContent='';
  const qq=q.trim().toLowerCase();
  const vis=IDEAS.filter(x=>{
    if(cat!=='all'&&x.c!==cat)return false;
    if(cost!=='all'&&x.s!==cost)return false;
    if(!qq)return true;
    return (x.t+' '+x.te+' '+x.d+' '+x.de+' '+x.i+' '+x.s).toLowerCase().includes(qq);
  });
  if(!vis.length){
    const d=document.createElement('div');d.className='empty';
    d.textContent='Под эти фильтры ничего не подходит.';list.append(d);return;
  }
  let lastCat='';
  vis.forEach(x=>{
    if(x.c!==lastCat&&cat==='all'){
      lastCat=x.c;
      const g=document.createElement('div');g.className='grp';
      const dot=document.createElement('i');dot.style.background=CATS[x.c][1];
      g.append(dot,document.createTextNode(CATS[x.c][0]));
      list.append(g);
    }
    const row=document.createElement('div');
    row.className='row'+(picked.has(x.i)?' on':'');
    row.onclick=()=>{
      if(picked.has(x.i))picked.delete(x.i);else picked.add(x.i);
      row.classList.toggle('on',picked.has(x.i));
      saveLocal();
    };
    const num=document.createElement('div');num.className='num';num.textContent='#'+x.n;
    const body=document.createElement('div');body.className='body';
    const ttl=document.createElement('b');ttl.className='ttl';ttl.textContent=x.t;
    const desc=document.createElement('span');desc.className='desc';desc.textContent=x.d;
    const meta=document.createElement('div');meta.className='meta';
    if(x.m){const s=document.createElement('span');s.className='tag smart';s.textContent='умнее';meta.append(s)}
    const cst=document.createElement('span');cst.className='tag';cst.textContent=x.s+' · '+COSTS[x.s];meta.append(cst);
    const cat2=document.createElement('span');cat2.className='tag';cat2.textContent=CATS[x.c][0];meta.append(cat2);
    body.append(ttl,desc,meta);
    const box=document.createElement('div');box.className='box';box.textContent='✓';
    row.append(num,body,box);
    list.append(row);
  });
  const hint=document.createElement('div');hint.className='hint';
  hint.textContent='Выбор хранится в этом браузере. «Сохранить выбор» отдаёт список приложению.';
  list.append(hint);
}

function selectedText(){
  const lines=['# Мастерский бэклог маскота — '+picked.size+' идей',''];
  CATORDER.forEach(k=>{
    const items=IDEAS.filter(x=>x.c===k&&picked.has(x.i));
    if(!items.length)return;
    lines.push('## '+CATS[k][0]);
    items.forEach(x=>lines.push('- ['+x.s+(x.m?' · умнее':'')+'] '+x.t+' — '+x.d));
    lines.push('');
  });
  return lines.join('\n')||'Бэклог пуст.';
}

el('q').oninput=e=>{q=e.target.value;render()};
el('copy').onclick=async()=>{
  const txt=selectedText();
  try{await navigator.clipboard.writeText(txt)}catch(e){
    const ta=document.createElement('textarea');ta.value=txt;document.body.append(ta);
    ta.select();try{document.execCommand('copy')}catch(_){}ta.remove();
  }
  flash(el('copy'),'Скопировано ✓');
};
el('save').onclick=()=>{
  saveLocal();
  window.__ocmMascotIdeas=[...picked];
  flash(el('save'),'Сохранено: '+picked.size);
  try{window.parent&&window.parent.postMessage({type:'ocm.mascotIdeaBacklog',ids:[...picked]},'*')}catch(e){}
};

function flash(btn,txt){
  const old=btn.textContent;btn.textContent=txt;
  setTimeout(()=>{btn.textContent=old},1400);
}

render();
})();
</script></body></html>
